# Minimal local Supabase stack for development and integration tests:
# Postgres (Supabase image, same roles/extensions as hosted), GoTrue (Auth),
# PostgREST (Data API) and an nginx gateway exposing /auth/v1 and /rest/v1
# on one origin, like the hosted API. Managed by `pnpm db:start`.
name: fcmi-supabase

services:
  db:
    image: supabase/postgres:17.11.0.003
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - ./init/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-54322}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 2s
      timeout: 5s
      retries: 60

  auth:
    image: supabase/gotrue:v2.197.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:${API_PORT:-54321}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL:-http://localhost:3000}/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      # Local only: no SMTP server, so sign-ups are confirmed immediately.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_RATE_LIMIT_SIGN_IN_SIGN_UPS: "10000"
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: "10000"
      GOTRUE_RATE_LIMIT_VERIFY: "10000"
      GOTRUE_PASSWORD_MIN_LENGTH: "8"

  rest:
    image: postgrest/postgrest:v16.4
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      # Mirrors the hosted default: responses are capped at 1000 rows.
      PGRST_DB_MAX_ROWS: "1000"

  gateway:
    image: nginx:alpine
    depends_on: [auth, rest]
    volumes:
      - ./init/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${API_PORT:-54321}:8000"
